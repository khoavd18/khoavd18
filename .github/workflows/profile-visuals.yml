name: Refresh profile visuals

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:23 in Vietnam (UTC+7).
    - cron: '23 1 * * *'
  push:
    paths:
      - README.md
      - .github/workflows/profile-visuals.yml
      - .github/scripts/update_profile_visuals.py
      - .github/scripts/generate_activity_graph.py

permissions:
  contents: write

concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate recent contribution graph
        id: activity
        continue-on-error: true
        env:
          PROFILE_GRAPH_USERNAME: ${{ github.repository_owner }}
          PROFILE_GRAPH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_activity_graph.py

      - name: Generate contribution snake
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/generated/snake.svg?color_snake=%238B5CF6
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=%2322D3EE

      - name: Generate 3D contribution map
        id: map
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Show generated visuals in the README
        run: python3 .github/scripts/update_profile_visuals.py

      - name: Commit generated visuals
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          if [ -d assets/generated ]; then
            git add -- assets/generated
          fi
          if [ -d profile-3d-contrib ]; then
            git add -- profile-3d-contrib
          fi
          if git diff --cached --quiet; then
            echo 'Profile visuals are already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh profile visuals'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Report generator status
        if: always()
        env:
          ACTIVITY_RESULT: ${{ steps.activity.outcome }}
          SNAKE_RESULT: ${{ steps.snake.outcome }}
          MAP_RESULT: ${{ steps.map.outcome }}
        run: |
          echo "Recent activity graph: $ACTIVITY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Snake generator: $SNAKE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "3D map generator: $MAP_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ACTIVITY_RESULT" != success ] || [ "$SNAKE_RESULT" != success ] || [ "$MAP_RESULT" != success ]; then
            echo 'A generator failed. Existing images are retained; inspect the failed step and rerun.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
